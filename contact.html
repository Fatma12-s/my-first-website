<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تواصل معنا - دائرة التدريب والتطوير المهني المستمر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-center" style="padding-top: 32px; padding-bottom: 18px;">
            <a href="index.html" style="display: flex; flex-direction: column; align-items: center; gap: 0.2em; text-align: center;">
                <img src="./assets/logo.png" alt="شعار الدائرة" class="brand-logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="programs.html">البرامج التدريبية</a></li>
                    <li><a href="contact.html" class="active">تواصل معنا</a></li>
                    <li><a href="admin.html" class="btn primary" style="font-size:1.08em; padding:10px 24px;">لوحة التحكم</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="section">
        <div class="container">
            <section class="hero" style="padding: 64px 0 56px 0; background: linear-gradient(120deg, #e6f7f4 0%, #fafdff 100%); border-radius: 0 0 36px 36px; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 320px;">
                <h2 class="section-title" style="color: #295c4a; font-size: 2.1em; margin-bottom: 18px; text-align: center; font-weight: 800;">تواصل معنا</h2>
                <p class="hero-desc" style="font-size: 1.15rem; max-width: 700px; margin: 0 auto 18px auto; color: #2a3d3a; font-weight: 600; background: #e6f7f4; border-radius: 18px; padding: 22px 18px; text-align: center;">لأي استفسار أو تواصل مع دائرة التدريب والتطوير المهني المستمر يرجى تعبئة النموذج أدناه وسيتم الرد عليك في أقرب وقت.</p>
            </section>
            <form style="max-width: 600px; display: grid; gap: 18px; margin: 0 auto; background: #fff; border-radius: 18px; box-shadow: 0 4px 18px #295c4a11; padding: 32px 18px;">
                <div>
                    <label for="name" style="font-weight: 800; color: #1f2328;">الاسم</label>
                    <input type="text" id="name" name="name" required style="padding: 14px; border-radius: 18px; border: 1px solid #cfd8d6; font-family: 'Cairo',sans-serif; font-size: 1.1rem;">
                </div>
                <div>
                    <label for="email" style="font-weight: 800; color: #1f2328;">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required style="padding: 14px; border-radius: 18px; border: 1px solid #cfd8d6; font-family: 'Cairo',sans-serif; font-size: 1.1rem;">
                </div>
                <div>
                    <label for="message" style="font-weight: 800; color: #1f2328;">الرسالة</label>
                    <textarea id="message" name="message" rows="5" required style="padding: 14px; border-radius: 18px; border: 1px solid #cfd8d6; font-family: 'Cairo',sans-serif; font-size: 1.1rem;"></textarea>
                </div>
                <button type="submit" class="btn primary" style="width: 100%; font-size: 1.15rem;">إرسال</button>
            </form>
        </div>
    </section>
    <footer>
        <small>© دائرة التدريب والتطوير المهني المستمر</small>
        <div style="width: 100%; margin-top: 12px; background: linear-gradient(120deg, #e6f7f4 0%, #fafdff 100%); padding: 10px 0;">
            <img src="./assets/logo2.png.png" alt="الشعار الثاني" style="width: 100%; height: auto; display: block; margin: 0 auto; max-width: 100%;">
        </div>
    </footer>
</body>
</html>
