<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تواصل معنا - دائرة التدريب والتطوير المهني المستمر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-center">
            <a href="index.html" style="display: flex; flex-direction: column; align-items: center; gap: 0.2em; text-align: center;">
                <img src="./assets/squh-header-logo.jpg" alt="شعار الدائرة" class="brand-logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="programs.html">البرامج التدريبية</a></li>
                    <li><a href="contact.html" class="active">تواصل معنا</a></li>
                    <li><a href="admin.html" class="btn primary" style="font-size:1.08em; padding:var(--space-sm) var(--space-lg);">لوحة التحكم</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="section">
        <div class="container">
            <section class="hero">
                <h2 class="section-title">تواصل معنا</h2>
                <p class="hero-desc">لأي استفسار أو تواصل مع دائرة التدريب والتطوير المهني المستمر يرجى تعبئة النموذج أدناه وسيتم الرد عليك في أقرب وقت.</p>
            </section>
            <form id="contactForm" style="max-width: 600px; display: grid; gap: var(--space-lg); margin: 0 auto; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-md); padding: var(--space-xl) var(--space-md);">
                <div class="form-group">
                    <label for="name">الاسم</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">الرسالة</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn primary" style="width: 100%; font-size: 1.15rem;">إرسال</button>
            </form>
        </div>
    </section>
    <footer>
        <small>© دائرة التدريب والتطوير المهني المستمر</small>
        <div style="width: 100%; margin-top: var(--space-2xs); background: linear-gradient(120deg, var(--brand-light) 0%, #fafdff 100%); padding: var(--space-2xs) 0;">
            <img src="./assets/logo2.png.png" alt="الشعار الثاني">
        </div>
    </footer>
    <script src="firebase-config.js?v=20260403-submit-fix"></script>
    <script src="email-config.js?v=20260404-attachment-preview-fix"></script>
    <script src="script.js?v=20260404-single-script-fix"></script>
</body>
</html>
