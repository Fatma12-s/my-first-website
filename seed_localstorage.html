<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Seed LocalStorage</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="font-family: Arial, sans-serif; padding:20px;">
  <h3>تهيئة بيانات تجريبية في LocalStorage</h3>
  <p>سيتم إدخال بيانات اختبارية ثم تحويلك إلى صفحة الإدارة لعرض الطلب.</p>
  <button id="seed">إضافة بيانات تجريبية وفتح لوحة الإدارة</button>
  <script>
    document.getElementById('seed').addEventListener('click', () => {
      const now = Date.now();
      const sample = {
        graduates: [{
          id: now,
          submittedAt: new Date().toLocaleString('ar-SA'),
          'grad-name': 'محمد أحمد',
          'grad-email': 'm.ahmad@example.com',
          'grad-phone': '0599001122',
          'grad-university': 'جامعة المثال',
          'grad-major': 'طب',
          'grad-graduation': '2024-06-15',
          'grad-message': 'اختبار إرسال النموذج',
          'grad-certificate': 'logo.png',
          'grad-id': 'logo.png'
        }],
        'internal-employees': [{
          id: now+1,
          submittedAt: new Date().toLocaleString('ar-SA'),
          name: 'سارة علي',
          email: 's.ali@example.com',
          phone: '0598883344',
          employeeId: 'EMP123',
          department: 'التمريض',
          position: 'ممرض',
          program: 'البرنامج 3',
          managerName: 'مدير القسم',
          managerEmail: 'manager@example.com',
          managerApproval: 'موافق',
          receipt: 'logo.png',
          notes: ''
        }]
      };

      localStorage.setItem('formSubmissions', JSON.stringify(sample));
      alert('تمت إضافة بيانات تجريبية. الانتقال إلى لوحة الإدارة...');
      location.href = 'admin.html';
    });
  </script>
  <footer style="text-align:center; margin-top: 24px; color:#666;">
    <div style="width: 100%; margin-top: 12px; background: linear-gradient(120deg, #e6f7f4 0%, #fafdff 100%); padding: 10px 0;">
      <img src="./assets/logo2.png.png" alt="الشعار الثاني" style="width: 100%; height: auto; display: block; margin: 0 auto; max-width: 100%;">
    </div>
  </footer>
</body>
</html>
