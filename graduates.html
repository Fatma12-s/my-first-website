<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تقديم طلب - تدريب الطلاب والخريجين">
    <title>تقديم الطلب - تدريب الطلاب والخريجين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Form-specific overrides */
        .back-link {
            display: inline-block;
            margin-bottom: var(--space-lg);
            color: var(--brand-main);
            font-weight: 600;
            text-decoration: underline;
        }

        .back-link:hover {
            color: #1d3c2e;
        }

        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                gap: var(--space-sm);
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-center">
            <a href="index.html" style="display: flex; flex-direction: column; align-items: center; gap: 0.2em; text-align: center;">
                <img src="./assets/squh-header-logo.jpg" alt="شعار الدائرة" class="brand-logo">
            </a>

            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="programs.html" class="active">البرامج التدريبية</a></li>
                    <li><a href="contact.html">تواصل معنا</a></li>
                    <li><a href="admin.html" class="btn primary" style="font-size:1.08em; padding:var(--space-sm) var(--space-lg);">لوحة التحكم</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <a href="programs.html" class="back-link">← العودة للبرامج</a>
            <h2 class="section-title">تقديم الطلب - تدريب الطلاب والخريجين</h2>
            
            <form id="graduates-form" enctype="multipart/form-data" style="max-width: 600px; display: grid; gap: var(--space-lg); margin: 0 auto;">
                <div class="form-group">
                    <label for="grad-name">الاسم الكامل</label>
                    <input type="text" id="grad-name" name="grad-name" required>
                </div>

                <div class="form-group">
                    <label for="grad-email">البريد الإلكتروني</label>
                    <input type="email" id="grad-email" name="grad-email" required>
                </div>

                <div class="form-group">
                    <label for="grad-phone">رقم الهاتف</label>
                    <input type="tel" id="grad-phone" name="grad-phone" required>
                </div>

                <div class="form-group">
                    <label for="grad-university">الجامعة/المعهد</label>
                    <input type="text" id="grad-university" name="grad-university" required>
                </div>

                <div class="form-group">
                    <label for="grad-major">التخصص</label>
                    <input type="text" id="grad-major" name="grad-major" required>
                </div>

                <div class="form-group">
                    <label for="grad-graduation">تاريخ التخرج</label>
                    <input type="date" id="grad-graduation" name="grad-graduation" required>
                </div>

                <div class="form-group">
                    <label for="grad-message">ملاحظات إضافية</label>
                    <textarea id="grad-message" name="grad-message" rows="4"></textarea>
                </div>

                <hr style="border: none; border-top: 2px solid var(--brand-main); margin: var(--space-2xl) 0;">
                <h4 style="color: var(--brand-main); margin-bottom: var(--space-lg);">📎 المرفقات المطلوبة</h4>

                <div class="form-group">
                    <label for="grad-certificate" style="display: flex; flex-direction: column; gap: var(--space-sm);">
                        📄 نسخة من الشهادة الجامعية (للخريجين) أو رسالة من المؤسسة التعليمية (للطلاب)
                    </label>
                    <input type="file" id="grad-certificate" name="grad-certificate" accept=".pdf,.jpg,.jpeg,.png" required>
                    <small style="color: #666;">أنواع الملفات المقبولة: PDF, JPG, PNG</small>
                </div>

                <div class="form-group">
                    <label for="grad-id" style="display: flex; flex-direction: column; gap: var(--space-sm);">
                        🪪 نسخة من البطاقة الشخصية
                    </label>
                    <input type="file" id="grad-id" name="grad-id" accept=".pdf,.jpg,.jpeg,.png" required>
                    <small style="color: #666;">أنواع الملفات المقبولة: PDF, JPG, PNG</small>
                </div>

                <button type="submit" class="btn primary" style="width: 100%; font-size: 1.1rem;">تقديم الطلب</button>
            </form>
        </div>
    </section>

    <footer>
        <small>© دائرة التدريب والتطوير المهني المستمر</small>
        <div style="margin-top: var(--space-md);">
            <a href="admin.html" target="_blank" style="color: var(--brand-main); text-decoration: underline; font-weight: 600;">📊 عرض لوحة التحكم والطلبات</a>
        </div>
        <div style="width: 100%; margin-top: var(--space-sm); background: linear-gradient(120deg, var(--brand-light) 0%, #fafdff 100%); padding: var(--space-sm) 0;">
            <img src="./assets/logo2.png.png" alt="الشعار الثاني">
