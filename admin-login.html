<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-500: #6dbfb1;
            --brand-600: #41726a;
            --radius: 12px;
            --shadow: 0 6px 18px rgba(0, 0, 0, .10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: linear-gradient(135deg, var(--brand-600) 0%, var(--brand-500) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--brand-600);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--brand-600);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cfd8d6;
            border-radius: var(--radius);
            font-family: "Cairo", sans-serif;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px rgba(109, 191, 177, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--brand-600);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            font-family: "Cairo", sans-serif;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--brand-500);
        }

        .error {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--brand-600);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #fffacd;
            border-right: 4px solid #ffc107;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 تسجيل الدخول</h1>
            <p>أدخل بيانات حسابك</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="employeeId">الرقم الوظيفي (Employee ID)</label>
                <input type="text" id="employeeId" name="employeeId" placeholder="مثال: EMP001" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn">دخول</button>

            <div class="error" id="error"></div>
        </form>

        <div class="login-link">
            ليس لديك حساب؟ <a href="admin-register.html">إنشاء حساب جديد</a>
        </div>

        <div class="back-link">
            <a href="index.html">← العودة للصفحة الرئيسية</a>
        </div>

        <div class="back-link">
            <button class="btn" style="background:#f0ad4e;color:#222;font-size:14px;padding:8px 10px;margin-top:10px;" onclick="resetAdminAccount()">إعادة تعيين كلمة المرور</button>
        </div>
        </div>
    </div>

    <script>
        function resetAdminAccount() {
            const employeeId = prompt('أدخل الرقم الوظيفي الذي تريد إعادة تعيينه:');
            if (!employeeId) return;

            const admins = JSON.parse(localStorage.getItem('admins')) || {};
            if (!admins[employeeId]) {
                alert('لا يوجد حساب بهذا الرقم الوظيفي.');
                return;
            }

            if (!confirm('هل أنت متأكد أنك تريد حذف الحساب وإعادة تعيين كلمة المرور؟')) return;
            delete admins[employeeId];
            localStorage.setItem('admins', JSON.stringify(admins));
            alert('تم حذف الحساب. يمكنك الآن إنشاء كلمة مرور جديدة من صفحة التسجيل.');
        }

        function handleLogin(event) {
            event.preventDefault();

            const employeeId = document.getElementById('employeeId').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');
            errorMsg.style.display = 'none';

            const admins = JSON.parse(localStorage.getItem('admins')) || {};
            if (!admins[employeeId]) {
                errorMsg.textContent = 'الرقم الوظيفي غير موجود';
                errorMsg.style.display = 'block';
                document.getElementById('employeeId').focus();
                return;
            }

            const storedPassword = admins[employeeId].password;
            const encryptedInput = btoa(password);
            if (encryptedInput !== storedPassword) {
                errorMsg.textContent = 'كلمة المرور غير صحيحة';
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                return;
            }

            const session = {
                employeeId,
                loginAt: Date.now()
            };

            sessionStorage.setItem('adminToken', employeeId);
            sessionStorage.setItem('adminSession', JSON.stringify(session));

            const redirectTo = sessionStorage.getItem('redirectTo') || 'admin.html';
            sessionStorage.removeItem('redirectTo');
            window.location.href = redirectTo;
        }
    </script>
    <footer style="text-align:center; margin-top: 24px; color:#fff;">
        <div style="width: 100%; margin-top: 12px; background: linear-gradient(120deg, #e6f7f4 0%, #fafdff 100%); padding: 10px 0;">
            <img src="./assets/logo2.png.png" alt="الشعار الثاني" style="width: 100%; height: auto; display: block; margin: 0 auto; max-width: 100%;">
        </div>
    </footer>
</body>
</html>
