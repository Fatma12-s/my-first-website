<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-500: #6dbfb1;
            --brand-600: #41726a;
            --radius: 12px;
            --shadow: 0 6px 18px rgba(0, 0, 0, .10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: linear-gradient(135deg, var(--brand-600) 0%, var(--brand-500) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--brand-600);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--brand-600);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cfd8d6;
            border-radius: var(--radius);
            font-family: "Cairo", sans-serif;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px rgba(109, 191, 177, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--brand-600);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            font-family: "Cairo", sans-serif;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--brand-500);
        }

        .error {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .status {
            color: var(--brand-600);
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--brand-600);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #666;
        }

        .help-text {
            margin-top: 6px;
            font-size: 12px;
            color: #6c757d;
            text-align: center;
        }

        .info-box {
            background: #fffacd;
            border-right: 4px solid #ffc107;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
        }

        .page-footer {
            text-align: center;
            color: #fff;
        }

        .page-footer img {
            width: 110px;
            height: auto;
            display: block;
            margin: 0 auto;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 تسجيل الدخول</h1>
            <p>أدخل بيانات حسابك</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="adminEmail">البريد الإلكتروني للمشرف</label>
                <input type="email" id="adminEmail" name="adminEmail" placeholder="admin@example.com" required autofocus>
                <div class="help-text">استخدم البريد الإلكتروني نفسه الموجود في Firebase Authentication.</div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn">دخول</button>

            <div class="error" id="error"></div>
            <div class="status" id="status"></div>
        </form>

        <div class="login-link">
            الوصول إلى لوحة التحكم مخصص للمشرفين فقط. إذا لم يكن لديك حساب مشرف، تواصل مع مسؤول النظام.
        </div>

        <div class="back-link">
            <a href="index.html">← العودة للصفحة الرئيسية</a>
        </div>

        <div class="back-link">
            <button type="button" id="resetPasswordBtn" class="btn" style="background:#f0ad4e;color:#222;font-size:14px;padding:8px 10px;margin-top:10px;">إعادة تعيين كلمة المرور</button>
        </div>
    </div>

    <script type="module" src="firebase-config.js?v=1.2"></script>
    <script src="admin-auth.js"></script>
    <script>
        function showStatus(message) {
            const statusMsg = document.getElementById('status');
            if (!statusMsg) return;
            statusMsg.textContent = message || '';
            statusMsg.style.display = message ? 'block' : 'none';
        }

        function showError(message) {
            const errorMsg = document.getElementById('error');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            showStatus('');
        }

        function clearError() {
            const errorMsg = document.getElementById('error');
            errorMsg.textContent = '';
            errorMsg.style.display = 'none';
        }

        function setFormEnabled(enabled) {
            const form = document.getElementById('loginForm');
            const resetBtn = document.getElementById('resetPasswordBtn');
            if (form) {
                form.querySelectorAll('input, button').forEach((element) => {
                    element.disabled = !enabled;
                });
            }
            if (resetBtn) {
                resetBtn.disabled = !enabled;
            }
        }

        function getReadableAuthError(err) {
            const code = String(err && err.code || err && err.message || '').toLowerCase();
            if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found') || code.includes('invalid-login-credentials')) {
                return 'بيانات الدخول غير صحيحة.';
            }
            if (code.includes('invalid-email')) {
                return 'صيغة البريد الإلكتروني غير صحيحة.';
            }
            if (code.includes('too-many-requests')) {
                return 'تم تقييد المحاولة مؤقتًا بسبب كثرة المحاولات. حاول لاحقًا.';
            }
            if (code.includes('not-authorized')) {
                return 'تم تسجيل الدخول، لكن هذا الحساب غير مضاف كمشرف مفعل داخل Firestore.';
            }
            return 'تعذر تسجيل الدخول حاليًا. تحقق من إعدادات Firebase وحساب المشرف.';
        }

        async function resetAdminAccount() {
            const email = prompt('أدخل البريد الإلكتروني للمشرف لإرسال رابط إعادة تعيين كلمة المرور:');
            if (!email) return;

            try {
                clearError();
                showStatus('جاري إرسال رابط إعادة التعيين...');
                await window.adminAuth.sendPasswordReset(email.trim());
                showStatus('');
                alert('تم إرسال رابط إعادة تعيين كلمة المرور إلى البريد الإلكتروني إذا كان الحساب موجودًا.');
            } catch (err) {
                console.error(err);
                alert(getReadableAuthError(err));
            } finally {
                showStatus('');
            }
        }

        async function bootstrapAdminLogin() {
            clearError();
            setFormEnabled(false);
            showStatus('جاري تهيئة تسجيل الدخول...');

            try {
                if (!window.adminAuth || typeof window.adminAuth.ensureFirebase !== 'function') {
                    throw new Error('admin-auth-unavailable');
                }

                const isReady = await window.adminAuth.ensureFirebase();
                if (!isReady) {
                    throw new Error('firebase-init-failed');
                }

                const result = await window.adminAuth.requireAdmin();
                if (result.ok) {
                    window.location.replace(sessionStorage.getItem('redirectTo') || 'admin.html');
                    return;
                }

                showStatus('');
                setFormEnabled(true);
            } catch (err) {
                console.error('تعذر تهيئة صفحة تسجيل الدخول:', err);
                showError('تعذر تحميل خدمة تسجيل الدخول. تحقق من الاتصال بالإنترنت وإعدادات Firebase ثم أعد المحاولة.');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('#loginForm button[type="submit"]');

            clearError();
            showStatus('');

            if (!window.adminAuth || typeof window.adminAuth.signIn !== 'function') {
                showError('خدمة تسجيل الدخول غير جاهزة بعد. أعد تحميل الصفحة ثم حاول مرة أخرى.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التحقق...';

            try {
                const isReady = await window.adminAuth.ensureFirebase();
                if (!isReady) {
                    throw new Error('firebase-init-failed');
                }

                await window.adminAuth.signIn(email, password);
                const redirectTo = sessionStorage.getItem('redirectTo') || 'admin.html';
                sessionStorage.removeItem('redirectTo');
                window.location.href = redirectTo;
            } catch (err) {
                console.error(err);
                showError(getReadableAuthError(err));
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'دخول';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('resetPasswordBtn').addEventListener('click', resetAdminAccount);
            bootstrapAdminLogin();
        });
    </script>
    <footer class="page-footer">
        <img src="./assets/logo2.png.png" alt="الشعار الثاني">
    </footer>
</body>
</html>
