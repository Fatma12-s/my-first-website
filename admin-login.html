<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-500: #6dbfb1;
            --brand-600: #41726a;
            --radius: 12px;
            --shadow: 0 6px 18px rgba(0, 0, 0, .10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: linear-gradient(135deg, var(--brand-600) 0%, var(--brand-500) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--brand-600);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--brand-600);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cfd8d6;
            border-radius: var(--radius);
            font-family: "Cairo", sans-serif;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px rgba(109, 191, 177, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--brand-600);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            font-family: "Cairo", sans-serif;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--brand-500);
        }

        .error {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--brand-600);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #fffacd;
            border-right: 4px solid #ffc107;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 لوحة التحكم</h1>
            <p>يرجى إدخال كلمة المرور للدخول</p>
        </div>

        <div class="info-box">
            💡 اطلب كلمة المرور من مسؤول النظام
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>

            <button type="submit" class="btn">دخول</button>

            <div class="error" id="error">كلمة المرور غير صحيحة</div>
        </form>

        <div class="back-link">
            <a href="index.html">← العودة للصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        // كلمة المرور الصحيحة (يمكن تغييرها)
        const ADMIN_PASSWORD = 'admin123';

        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');

            if (password === ADMIN_PASSWORD) {
                // حفظ التوكن في sessionStorage (ينتهي عند إغلاق المتصفح)
                sessionStorage.setItem('adminToken', 'authenticated');
                // الذهاب إلى الصفحة المطلوبة
                const redirectTo = sessionStorage.getItem('redirectTo') || 'admin.html';
                sessionStorage.removeItem('redirectTo');
                window.location.href = redirectTo;
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }
    </script>
</body>
</html>
