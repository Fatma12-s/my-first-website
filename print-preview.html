<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معاينة الاستمارة قبل الحفظ</title>
  <style>
    :root {
      --brand: #1f4f45;
      --bg: #f4f7f6;
      --panel: #ffffff;
      --line: #d8e2df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cairo", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: #1f2937;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-bottom: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .toolbar button {
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #fff;
      color: #111;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .toolbar button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .preview-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      min-height: 78vh;
    }
    iframe {
      width: 100%;
      min-height: 78vh;
      border: 0;
      background: #fff;
    }
    .msg {
      padding: 14px;
      border: 1px dashed #d1d5db;
      background: #fff;
      border-radius: 8px;
      margin-bottom: 10px;
      color: #374151;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="message" class="msg" style="display:none"></div>

    <div class="toolbar">
      <button id="refreshBtn" type="button">معاينة</button>
      <button id="saveBtn" class="primary" type="button">حفظ كـ PDF / طباعة</button>
      <button id="closeBtn" type="button">إغلاق</button>
    </div>

    <div class="preview-wrap">
      <iframe id="previewFrame" title="معاينة الاستمارة"></iframe>
    </div>
  </div>

  <script>
    (function () {
      const msgEl = document.getElementById('message');
      const frame = document.getElementById('previewFrame');
      const refreshBtn = document.getElementById('refreshBtn');
      const saveBtn = document.getElementById('saveBtn');
      const closeBtn = document.getElementById('closeBtn');

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      const key = token ? `printPreviewHtml:${token}` : '';
      const payloadKey = token ? `printPreviewPayload:${token}` : '';

      function showMessage(text) {
        msgEl.style.display = 'block';
        msgEl.textContent = text;
      }

      function getHtmlFromStorage() {
        if (!key) return '';
        try {
          return sessionStorage.getItem(key) || '';
        } catch (err) {
          return '';
        }
      }

      function getPayloadFromStorage() {
        if (!payloadKey) return null;
        try {
          const raw = sessionStorage.getItem(payloadKey);
          return raw ? JSON.parse(raw) : null;
        } catch (err) {
          console.warn('تعذر قراءة بيانات المعاينة الإضافية:', err);
          return null;
        }
      }

      function getAttachmentDefinitions(formName) {
        if (formName === 'graduates') {
          return [
            { label: 'السيرة الذاتية / CV', keys: ['cv', 'cvFile'], urlKeys: ['cvFileURL'] },
            { label: 'البطاقة الشخصية / ID Card', keys: ['idCard', 'idCardCopy'], urlKeys: ['idCardCopyURL'] },
            { label: 'خطاب الجامعة / University Letter', keys: ['universityLetter'], urlKeys: ['universityLetterURL'] },
            { label: 'مرفقات أخرى / Other Attachments', keys: ['otherAttachment', 'otherAttachments'], urlKeys: ['otherAttachmentsURL'] }
          ];
        }

        if (['training-employees', 'training-others', 'internal-employees', 'internal-others'].includes(formName)) {
          return [
            { label: 'إيصال الدفع / Payment Receipt', keys: ['receipt'], urlKeys: ['receiptURL'] }
          ];
        }

        return [];
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function isRemoteAttachmentUrl(value) {
        return /^https:\/\//i.test(String(value || '').trim());
      }

      function isOpenableAsset(value) {
        return isRemoteAttachmentUrl(value);
      }

      function getAttachmentUrl(value) {
        if (!value) return '';
        if (typeof value === 'object') {
          const candidate = String(value.url || value.dataUrl || value.preview || '').trim();
          return isOpenableAsset(candidate) ? candidate : '';
        }
        const candidate = String(value || '').trim();
        return isOpenableAsset(candidate) ? candidate : '';
      }

      function getAttachmentName(value, fallbackLabel) {
        if (!value) return fallbackLabel;
        if (typeof value === 'object' && value.name) return String(value.name);
        if (typeof value === 'string' && value.trim() && !isOpenableAsset(value)) return String(value);
        return fallbackLabel;
      }

      function getAttachmentType(value, url, name) {
        const explicitType = value && typeof value === 'object' ? String(value.type || '').trim().toLowerCase() : '';
        if (explicitType) return explicitType;

        const lowerUrl = String(url || '').toLowerCase();
        const lowerName = String(name || '').toLowerCase();
        if (/\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(lowerUrl) || /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(lowerName)) {
          return 'image/*';
        }
        if (/\.pdf(\?|#|$)/i.test(lowerUrl) || /\.pdf(\?|#|$)/i.test(lowerName)) {
          return 'application/pdf';
        }
        return '';
      }

      function getAttachmentKind(type, url, name) {
        const normalizedType = String(type || '').toLowerCase();
        const lowerUrl = String(url || '').toLowerCase();
        const lowerName = String(name || '').toLowerCase();
        if (normalizedType.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(lowerUrl) || /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(lowerName)) {
          return 'image';
        }
        if (normalizedType === 'application/pdf' || /\.pdf(\?|#|$)/i.test(lowerUrl) || /\.pdf(\?|#|$)/i.test(lowerName)) {
          return 'pdf';
        }
        return url ? 'link' : 'missing';
      }

      function buildAttachmentsFromPayload(payload) {
        if (!payload || !payload.data) return [];

        const formName = String(payload.formName || '').trim();
        const data = payload.data || {};

        return getAttachmentDefinitions(formName).map(function (config, index) {
          const directValue = config.keys.map(function (keyName) {
            return data[keyName];
          }).find(function (value) {
            return value !== undefined && value !== null && value !== '';
          });

          const urlValue = config.urlKeys.map(function (keyName) {
            return String(data[keyName] || '').trim();
          }).find(Boolean) || '';

          const normalizedValue = directValue && typeof directValue === 'object'
            ? Object.assign({}, directValue, (urlValue && !directValue.url) ? { url: urlValue } : {})
            : (urlValue ? { url: urlValue } : directValue);

          const url = getAttachmentUrl(normalizedValue);
          const fileName = getAttachmentName(normalizedValue, config.label);
          const fileType = getAttachmentType(normalizedValue, url, fileName) || 'غير محدد';
          const kind = getAttachmentKind(fileType, url, fileName);
          const message = normalizedValue && typeof normalizedValue === 'object'
            ? String(normalizedValue.message || '').trim()
            : '';

          return {
            index: index,
            label: config.label,
            url: url,
            fileName: fileName,
            fileType: fileType,
            kind: kind,
            message: message
          };
        });
      }

      function createAttachmentItemHtml(attachment) {
        var previewHtml = '';
        if (attachment.kind === 'pdf' && attachment.url) {
          previewHtml = '<div class="attachment-preview attachment-preview-pdf"><iframe src="' + escapeHtml(attachment.url) + '#toolbar=0&navpanes=0&scrollbar=0" width="100%" height="500" title="' + escapeHtml(attachment.fileName) + '"></iframe></div>';
        } else if (attachment.kind === 'image' && attachment.url) {
          previewHtml = '<div class="attachment-preview attachment-preview-image"><img src="' + escapeHtml(attachment.url) + '" alt="' + escapeHtml(attachment.fileName) + '" style="max-width:100%; border:1px solid #ccc;"></div>';
        } else if (attachment.url) {
          previewHtml = '<div class="attachment-preview attachment-preview-link"><a href="' + escapeHtml(attachment.url) + '" target="_blank" rel="noopener noreferrer">عرض المرفق</a></div>';
        } else {
          previewHtml = '<div class="attachment-preview attachment-preview-empty">' + escapeHtml(attachment.message || 'هذا المرفق محفوظ ولا يحتوي على محتوى قابل للعرض في المعاينة') + '</div>';
        }

        var actionsHtml = attachment.url
          ? '<div class="attachment-actions"><a class="attachment-btn" href="' + escapeHtml(attachment.url) + '" target="_blank" rel="noopener noreferrer">عرض</a><a class="attachment-btn secondary" href="' + escapeHtml(attachment.url) + '" download="' + escapeHtml(attachment.fileName) + '">تحميل</a></div>'
          : '';

        return [
          '<div class="attachment-item">',
          '<div class="attachment-item-title">' + escapeHtml(String(attachment.index + 1) + '. ' + attachment.label) + '</div>',
          '<div class="attachment-meta"><strong>اسم الملف:</strong> ' + escapeHtml(attachment.fileName || 'لا يوجد مرفق') + '</div>',
          '<div class="attachment-meta"><strong>نوع الملف:</strong> ' + escapeHtml(attachment.fileType || '---') + '</div>',
          previewHtml,
          actionsHtml,
          '</div>'
        ].join('');
      }

      function injectAttachmentPreviews(payload) {
        if (!payload || !payload.data || !frame.contentWindow || !frame.contentWindow.document) {
          return;
        }

        var attachments = buildAttachmentsFromPayload(payload).filter(function (attachment) {
          return attachment.url || attachment.fileName;
        });
        if (!attachments.length) {
          return;
        }

        var doc = frame.contentWindow.document;
        var attachmentsSection = doc.querySelector('.attachments-section');
        if (!attachmentsSection) {
          return;
        }

        var attachmentsList = attachmentsSection.querySelector('.attachments-list');
        if (!attachmentsList) {
          attachmentsList = doc.createElement('div');
          attachmentsList.className = 'attachments-list';
          attachmentsSection.appendChild(attachmentsList);
        }

        attachmentsList.innerHTML = attachments.map(createAttachmentItemHtml).join('');
      }

      function renderPreview() {
        const html = getHtmlFromStorage();
        if (!html) {
          showMessage('تعذر تحميل المعاينة. الرجاء العودة للصفحة السابقة ثم الضغط على زر المعاينة مرة أخرى.');
          frame.srcdoc = '<!doctype html><html><body style="font-family:Tahoma; padding:20px;">لا توجد بيانات للمعاينة.</body></html>';
          return false;
        }

        frame.srcdoc = html;
        msgEl.style.display = 'none';
        return true;
      }

      function waitForImagesAndPrint() {
        const doc = frame.contentWindow && frame.contentWindow.document;
        if (!doc) return;
        const images = Array.from(doc.images || []);

        const doPrint = function () {
          try {
            frame.contentWindow.focus();
            frame.contentWindow.print();
          } catch (err) {
            showMessage('تعذر تنفيذ أمر الطباعة.');
          }
        };

        if (!images.length) {
          doPrint();
          return;
        }

    Promise.all(images.map(function (img) {
      return new Promise(function (resolve) {
        if (img.complete) {
          resolve();
          return;
        }

        const done = function () { resolve(); };
        img.addEventListener('load', done, { once: true });
        img.addEventListener('error', done, { once: true });
      });
    })).finally(function () {
      setTimeout(doPrint, 220);
    });
      }

      refreshBtn.addEventListener('click', renderPreview);
      saveBtn.addEventListener('click', waitForImagesAndPrint);
      closeBtn.addEventListener('click', function () { window.close(); });

      frame.addEventListener('load', function () {
        injectAttachmentPreviews(getPayloadFromStorage());
      });

      renderPreview();
    })();
  </script>
</body>
</html>
