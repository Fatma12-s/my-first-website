<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تقديم طلب - البرامج التدريبية (موظفين)">
    <title>تقديم طلب - البرامج التدريبية (موظفين)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root{--radius:12px;--font:"Cairo",ui-sans-serif,system-ui,"Noto Sans Arabic",Segoe UI,Tahoma,Arial,sans-serif}
        body{margin:0;font-family:var(--font);color:#1f2328;background:#fff}
        .container{max-width:1200px;padding:0 20px;margin:auto}
        main.container{max-width:1000px}
        form{max-width:720px;margin:30px auto;display:grid;gap:16px}
        label{font-weight:700}
        input,select,textarea{padding:10px;border:1px solid #cfd8d6;border-radius:var(--radius);font-family:var(--font)}
        .form-btn{padding:12px;border-radius:var(--radius);background:var(--brand-main);color:#fff;border:none;font-weight:800;cursor:pointer}
        .back-link{display:inline-block;margin:12px 0;color:var(--brand-main);text-decoration:underline}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-center" style="padding-top: 32px; padding-bottom: 18px;">
            <a href="index.html" style="display: flex; flex-direction: column; align-items: center; gap: 0.2em; text-align: center;">
                <img src="./assets/logo.png" alt="شعار الدائرة" class="brand-logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="programs.html" class="active">البرامج التدريبية</a></li>
                    <li><a href="contact.html">تواصل معنا</a></li>
                    <li><a href="admin.html" class="btn primary" style="font-size:1.08em; padding:10px 24px;">لوحة التحكم</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <a href="programs.html" class="back-link">← العودة للبرامج</a>
        <form id="training-employees-form" enctype="multipart/form-data">
            <div>
                <label for="te-name">الاسم الكامل</label>
                <input type="text" id="te-name" name="name" required>
            </div>

            <div>
                <label for="te-email">البريد الإلكتروني</label>
                <input type="email" id="te-email" name="email" required>
            </div>

            <div>
                <label for="te-phone">رقم الهاتف</label>
                <input type="tel" id="te-phone" name="phone" required>
            </div>

            <div>
                <label for="te-empid">رقم الموظف</label>
                <input type="text" id="te-empid" name="employeeId" required>
            </div>

            <div>
                <label for="te-dept">القسم</label>
                <input type="text" id="te-dept" name="department" required>
            </div>

            <div>
                <label for="te-program">اختر البرنامج</label>
                <select id="te-program" name="program" required>
                    <option value="">-- اختر برنامج --</option>
                    <option value="الإسعافات الأولية المتقدمة">الإسعافات الأولية المتقدمة</option>
                    <option value="أساسيات رعاية المرضى">أساسيات رعاية المرضى</option>
                    <option value="الرعاية الحرجة والطوارئ">الرعاية الحرجة والطوارئ</option>
                    <option value="مكافحة العدوى وسياسات النظافة">مكافحة العدوى وسياسات النظافة</option>
                    <option value="إدارة الأدوية والسلامة الدوائية">إدارة الأدوية والسلامة الدوائية</option>
                    <option value="مهارات التواصل مع المرضى">مهارات التواصل مع المرضى</option>
                    <option value="التخدير ومراقبة الحالات">التخدير ومراقبة الحالات</option>
                    <option value="تمريض الجراحة والرعاية ما بعد العملية">تمريض الجراحة والرعاية ما بعد العملية</option>
                    <option value="تمريض الطوارئ">تمريض الطوارئ</option>
                    <option value="رعاية الحالات المزمنة">رعاية الحالات المزمنة</option>
                    <option value="إدارة الجودة في الرعاية الصحية">إدارة الجودة في الرعاية الصحية</option>
                    <option value="الصحة المهنية وسلامة العاملين">الصحة المهنية وسلامة العاملين</option>
                    <option value="إدارة الموارد البشرية الصحية">إدارة الموارد البشرية الصحية</option>
                    <option value="التخطيط والتقييم التدريبي">التخطيط والتقييم التدريبي</option>
                    <option value="مهارات العرض والتدريس الطبي">مهارات العرض والتدريس الطبي</option>
                    <option value="تحليل ومؤشرات الأداء الصحية">تحليل ومؤشرات الأداء الصحية</option>
                    <option value="الرعاية التلطيفية وإدارة الألم">الرعاية التلطيفية وإدارة الألم</option>
                    <option value="نظم المعلومات الصحية والسجلات الطبية">نظم المعلومات الصحية والسجلات الطبية</option>
                    <option value="الإسعاف الطبي الميداني">الإسعاف الطبي الميداني</option>
                    <option value="رعاية الأم والطفل">رعاية الأم والطفل</option>
                    <option value="صحة المجتمع والوقاية">صحة المجتمع والوقاية</option>
                    <option value="القيادة والإدارة للمؤسسات الصحية">القيادة والإدارة للمؤسسات الصحية</option>
                    <option value="تأهيل الخريجين عملياً">تأهيل الخريجين عملياً</option>
                    <option value="الوقاية من الأمراض المعدية">الوقاية من الأمراض المعدية</option>
                    <option value="التدريب على استخدام الأجهزة الطبية">التدريب على استخدام الأجهزة الطبية</option>
                    <option value="إدارة الأزمات والكوارث الصحية">إدارة الأزمات والكوارث الصحية</option>
                    <option value="الأخلاقيات الطبية والخصوصية">الأخلاقيات الطبية والخصوصية</option>
                    <option value="تقنيات التمريض المتقدمة">تقنيات التمريض المتقدمة</option>
                    <option value="تدريب المدربين (TOT)">تدريب المدربين (TOT)</option>
                    <option value="تطوير المهارات السريرية المتقدمة">تطوير المهارات السريرية المتقدمة</option>
                </select>
            </div>

            <div>
                <label for="te-manager">اسم المدير المباشر</label>
                <input type="text" id="te-manager" name="managerName" required>
            </div>

            <div>
                <label for="te-manager-email">بريد المدير</label>
                <input type="email" id="te-manager-email" name="managerEmail" required>
            </div>

            <div>
                <label for="te-receipt">إيصال الدفع (إن وجد)</label>
                <input type="file" id="te-receipt" name="receipt" accept=".pdf,.jpg,.png">
            </div>

            <div>
                <label for="te-notes">ملاحظات إضافية</label>
                <textarea id="te-notes" name="notes" rows="4"></textarea>
            </div>

            <button type="submit" class="form-btn">تقديم الطلب</button>
        </form>

        <footer style="text-align:center;margin:40px 0;color:#666">
            <a href="admin.html" style="color:var(--brand-600);text-decoration:underline">عرض لوحة التحكم والطلبات</a>
            <div style="width: 100%; margin-top: 12px; background: linear-gradient(120deg, #e6f7f4 0%, #fafdff 100%); padding: 10px 0;">
                <img src="./assets/logo2.png.png" alt="الشعار الثاني" style="width: 100%; height: auto; display: block; margin: 0 auto; max-width: 100%;">
            </div>
        </footer>
    </main>

        <script>
            (async function(){
                try{ const res = await fetch('firebase-config.js', {method:'HEAD'}); if(res.ok){ const s=document.createElement('script'); s.src='firebase-config.js'; document.head.appendChild(s);} }catch(e){}
                const s2=document.createElement('script'); s2.src='script.js'; document.body.appendChild(s2);
            })();
        </script>
</body>
</html>
